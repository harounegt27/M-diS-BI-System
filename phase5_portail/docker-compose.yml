version: '3.8'

services:

  backend:
    build: ./backend
    container_name: medis_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app/ml:/app/app/ml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: medis_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped